# Calibration benchmark dataset for Sentinel-RAG Evaluators
# Hand-labeled cases across faithful, hallucinated, irrelevant context, and refusal categories.
# Used for evaluating NLI entailment threshold selection and AUROC optimization post B-1 fix.

cases:
  - id: "case_01_faithful_redis"
    type: "faithful"
    query: "What is the default port for Redis?"
    retrieved_chunks:
      - "Redis is an in-memory key-value data store. By default, Redis listens on TCP port 6379."
      - "Clients connecting to Redis should ensure port 6379 is reachable through the local firewall."
    answer: "Redis listens on TCP port 6379 by default."
    expected_ground_truth: "The default port for Redis is 6379."
    expects_refusal: false
    label_faithfulness: 1
    label_precision: 1

  - id: "case_02_faithful_qdrant"
    type: "faithful"
    query: "Does Qdrant support atomic collection rename?"
    retrieved_chunks:
      - "Qdrant does not provide an atomic collection rename command in its API."
      - "To migrate traffic between collections without downtime, Qdrant users should create an alias pointing to the new collection."
    answer: "No, Qdrant does not support atomic collection rename. Users use aliases instead."
    expected_ground_truth: "Qdrant does not support atomic rename, so aliases must be used."
    expects_refusal: false
    label_faithfulness: 1
    label_precision: 1

  - id: "case_03_faithful_grpc"
    type: "faithful"
    query: "What is the purpose of keepalive ping in gRPC?"
    retrieved_chunks:
      - "gRPC keepalive pings are HTTP/2 PING frames sent periodically on a connection to verify that the transport is still alive."
      - "This prevents intermediate proxies from terminating idle connections."
    answer: "Keepalive pings send HTTP/2 PING frames to verify the connection is alive and prevent idle timeouts."
    expected_ground_truth: "Keepalive pings verify gRPC transport health and prevent idle disconnections."
    expects_refusal: false
    label_faithfulness: 1
    label_precision: 1

  - id: "case_04_faithful_flyway"
    type: "faithful"
    query: "How does Flyway track applied migrations?"
    retrieved_chunks:
      - "Flyway records executed migrations in a schema history table, typically named flyway_schema_history."
      - "Each migration row records the version, description, checksum, and execution status."
    answer: "Flyway tracks migrations in the flyway_schema_history table with checksums and status."
    expected_ground_truth: "Flyway uses the flyway_schema_history table to record applied migration versions."
    expects_refusal: false
    label_faithfulness: 1
    label_precision: 1

  - id: "case_05_faithful_python_async"
    type: "faithful"
    query: "Why should blocking CPU work be run in an executor in asyncio?"
    retrieved_chunks:
      - "In Python asyncio, long-running CPU-bound operations block the main event loop from processing I/O."
      - "Using loop.run_in_executor offloads heavy computation to a thread or process pool, keeping the event loop responsive."
    answer: "CPU-bound tasks block the asyncio event loop, so loop.run_in_executor is used to offload them to a thread pool."
    expected_ground_truth: "Running CPU tasks in an executor prevents blocking the single-threaded asyncio event loop."
    expects_refusal: false
    label_faithfulness: 1
    label_precision: 1

  - id: "case_06_hallucinated_postgres_port"
    type: "hallucinated"
    query: "What is the default port for PostgreSQL?"
    retrieved_chunks:
      - "PostgreSQL server accepts client connections on TCP port 5432 by standard convention."
      - "You can configure the listening port in postgresql.conf using the port directive."
    answer: "PostgreSQL listens on port 3306 by default and requires MySQL protocol emulation."
    expected_ground_truth: "PostgreSQL listens on TCP port 5432 by default."
    expects_refusal: false
    label_faithfulness: 0
    label_precision: 1

  - id: "case_07_hallucinated_kafka_retention"
    type: "hallucinated"
    query: "How long does Apache Kafka retain messages by default?"
    retrieved_chunks:
      - "Apache Kafka topic retention is configured by log.retention.hours, which defaults to 168 hours (7 days)."
      - "Once the retention window expires, old log segments are deleted or compacted based on topic policy."
    answer: "Kafka permanently stores all messages in memory without deleting them, retaining them for 30 years."
    expected_ground_truth: "Kafka topic retention defaults to 7 days (168 hours)."
    expects_refusal: false
    label_faithfulness: 0
    label_precision: 1

  - id: "case_08_hallucinated_oauth"
    type: "hallucinated"
    query: "What grant type is recommended for single-page applications without client secrets?"
    retrieved_chunks:
      - "For single-page applications that cannot securely maintain a client secret, Authorization Code Flow with PKCE is standard."
      - "PKCE mitigates authorization code interception attacks on public clients."
    answer: "Single-page applications should always use Client Credentials grant with hardcoded admin secrets."
    expected_ground_truth: "Authorization Code Flow with PKCE is recommended for SPAs."
    expects_refusal: false
    label_faithfulness: 0
    label_precision: 1

  - id: "case_09_hallucinated_jwt"
    type: "hallucinated"
    query: "What algorithm is commonly used for HMAC signing of JWTs?"
    retrieved_chunks:
      - "JSON Web Tokens frequently employ HS256 (HMAC using SHA-256) for symmetric cryptographic signing."
      - "Asymmetric signing algorithms like RS256 use a public/private key pair."
    answer: "JWT signatures are encrypted using MD5 with no secret key required."
    expected_ground_truth: "HS256 is commonly used for HMAC signing of JWT tokens."
    expects_refusal: false
    label_faithfulness: 0
    label_precision: 1

