version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: sentinel-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sentinel_rag_pgdata:/var/lib/postgresql/data

volumes:
  sentinel_rag_pgdata: