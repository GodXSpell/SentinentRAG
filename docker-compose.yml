services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d sentinel_rag" ]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sentinel-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  python-engine:
    build:
      context: ./python-core
      dockerfile: Dockerfile
    healthcheck:
      disable: true
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "8000:8000"
      - "50051:50051"
    depends_on:
      - qdrant

  java-control-plane:
    build:
      context: .
      dockerfile: sentinelRag_java/Dockerfile
    container_name: sentinel-java-control-plane
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sentinel_rag
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_GRPC_CLIENT_CHANNEL_DEFAULT_TARGET: static://python-engine:50051
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-development-secret}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SENTINEL_GATE_LATENCY_P95_BUDGET_MS: "150000"
      SENTINEL_GRPC_EVALUATION_DEADLINE_SECONDS: "300"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      python-engine:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:

